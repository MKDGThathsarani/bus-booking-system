<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bus Booking System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-md-6 col-lg-4">
                <!-- Login Card -->
                <div class="card shadow-lg border-0">
                    <div class="card-header text-center py-4">
                        <h3 class="mb-0">
                            <i class="fas fa-bus me-2"></i>Bus Booking
                        </h3>
                        <small class="opacity-75">Login to your account</small>
                    </div>
                    <div class="card-body p-4">
                        <!-- Alert Container -->
                        <div id="alertContainer"></div>
                        
                        <!-- Login Form -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user me-1"></i>Username / Email
                                </label>
                                <input type="text" class="form-control" id="username" 
                                       placeholder="Enter username" 
                                       value="admin" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-1"></i>Password
                                </label>
                                <input type="password" class="form-control" id="password" 
                                       placeholder="Enter password" 
                                       value="admin123" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </button>
                        </form>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="text-muted small mb-1">Demo Credentials</p>
                            <div class="d-flex justify-content-center gap-2 flex-wrap">
                                <span class="badge bg-primary">Admin: admin / admin123</span>
                                <span class="badge bg-success">Vendor: vendor / vendor123</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-center bg-white">
                        <small class="text-muted">
                            <i class="far fa-copyright me-1"></i>2024 Bus Booking System
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-overlay" style="display:none;">
        <div class="text-center">
            <div class="spinner-border" role="status"></div>
            <p class="loading-text">Logging in...</p>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Login Form Handler with better error handling
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Disable button to prevent multiple clicks
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Logging in...';
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            try {
                await loginUser(username, password);
            } catch (error) {
                console.error('Form submission error:', error);
                showAlert('danger', 'An unexpected error occurred. Please try again.');
            } finally {
                // Re-enable button
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
            }
        });
        
        // Test API connection on page load
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Testing API connection...');
            try {
                const testResponse = await fetch(API_BASE + '/BusBooking/GetBusVendors', {
                    method: 'GET',
                    headers: HEADERS,
                    mode: 'cors',
                    credentials: 'include'
                });
                if (testResponse.ok) {
                    console.log('API connection successful!');
                } else {
                    console.warn('API connection failed with status:', testResponse.status);
                    showAlert('warning', '<i class="fas fa-exclamation-triangle me-2"></i>Cannot connect to API server (Status: ' + testResponse.status + '). Please check your connection.');
                }
            } catch (error) {
                console.error('API connection test failed:', error);
                showAlert('danger', '<i class="fas fa-times-circle me-2"></i>Cannot connect to API server. Error: ' + error.message + '. Please check your internet connection and API URL.');
            }
        });
    </script>
</body>
</html>
